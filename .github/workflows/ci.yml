name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # No secrets are required here: this installs dependencies and runs static
      # checks, unit tests, and a production build. Cloud Functions secrets are
      # only read at runtime via Firebase Secret Manager (see functions/src/config.ts),
      # never at install/build time, so none are configured or exposed to this workflow.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Behavioral rules tests run the REAL firestore.rules/storage.rules files through the
      # actual Firestore/Storage emulator rules engine (see functions/src/*.behavioral.test.ts),
      # unlike the string-match rules tests above. They need a JVM (for the Firestore emulator)
      # and the emulators themselves, so they're kept out of the regular `npm test` step and run
      # here instead, against demo (non-billable, no-auth-required) Firebase projects only.
      - name: Set up Java (for Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Behavioral Firestore/Storage rules tests (real emulator)
        # `emulators:exec` starts the emulators, waits for them to be healthy, runs the given
        # command, and always tears the emulators down afterwards - it fails (non-zero exit)
        # if the emulators never become healthy, so this step fails closed rather than silently
        # skipping the suite. No production credentials are used or required: this only ever
        # talks to demo-* project IDs on the local emulator, never real Firestore/Storage.
        run: npx firebase emulators:exec --project demo-pageloom-rules-fs --only firestore,storage "npm run test:behavioral --workspace=@pageloom/functions"
        timeout-minutes: 10

      # The Functions emulator (unlike the rules-only behavioral step above) actually loads and
      # runs the DEPLOYED function code from functions/lib/index.js, not the TypeScript source -
      # that only gets produced by this build. Without it the emulator fails closed with
      # "functions/lib/index.js does not exist, can't deploy Cloud Functions" before the test
      # ever gets a chance to run.
      - name: Build functions (required for the Functions emulator below)
        run: npm run build --workspace=@pageloom/core && npm run prepare:vendor --workspace=@pageloom/functions && npm run build --workspace=@pageloom/functions

      # End-to-end customer lifecycle test: unlike the rules-only behavioral suite above, this
      # also runs the Functions emulator (the real Express API in functions/src/api.ts), which
      # imports functions/src/config.ts's defineSecret() params. The Functions emulator needs a
      # value for each at boot even for a demo project, so this writes a LOCAL, CI-only dummy
      # file consumed only by the emulator process (never checked in - functions/.secret.local
      # is gitignored, and every value here is a placeholder string, not a real credential).
      - name: Write dummy secrets for the emulator (E2E test only, not a real credential)
        run: |
          cat > functions/.secret.local << 'EOF'
          OPENAI_API_KEY=dummy
          GEMINI_API_KEY=dummy
          GOOGLE_WORKSPACE_SERVICE_ACCOUNT_JSON=dummy
          GOOGLE_WORKSPACE_SUBJECT=dummy
          GOOGLE_MAPS_API_KEY=dummy
          STRIPE_SECRET_KEY=dummy
          STRIPE_WEBHOOK_SECRET=dummy
          PAYPAL_CLIENT_ID=dummy
          PAYPAL_CLIENT_SECRET=dummy
          WHATSAPP_ACCESS_TOKEN=dummy
          WHATSAPP_PHONE_NUMBER_ID=dummy
          CRM_API_TOKEN=dummy
          ZAPIER_WEBHOOK_SECRET=dummy
          MAKE_WEBHOOK_SECRET=dummy
          N8N_API_KEY=dummy
          GITHUB_TOKEN=dummy
          RESEND_API_KEY=dummy
          TWILIO_ACCOUNT_SID=dummy
          TWILIO_AUTH_TOKEN=dummy
          EOF

      - name: End-to-end customer lifecycle test (real emulator)
        # Same non-negotiable safety property as the behavioral step: only ever talks to a
        # demo-* project ID on the local emulator, never real Firestore/Storage/Auth, and makes
        # no real Stripe call anywhere (see customer-lifecycle.e2e.test.ts's own safety assertion
        # that the project ID starts with "demo-").
        run: npx firebase emulators:exec --project demo-pageloom-e2e --only firestore,storage,auth,functions --debug "npm run test:e2e --workspace=@pageloom/functions"
        timeout-minutes: 18

      # Runs even when the known-failing behavioral step above fails, so a build regression is
      # never masked by (or blamed on) the documented emulator limitation.
      #
      # These 6 values are Firebase's public web client config (apiKey/authDomain/projectId/
      # storageBucket/messagingSenderId/appId) - not secrets. Per Firebase's own security model
      # they're meant to ship inside the built client bundle and are visible to anyone who opens
      # devtools on the deployed site; access control is enforced entirely by Firestore/Storage
      # Security Rules, never by hiding this config. That's why they're read from GitHub Actions
      # *variables* (`vars.*`, unmasked, listed under Settings > Actions > Variables) rather than
      # *secrets* (`secrets.*`) - using a secret here would be the wrong primitive and would
      # falsely suggest these need the same handling as an actual credential. No private/server
      # secret (API keys for Stripe/OpenAI/Google GenAI, service account credentials, etc.) is
      # used or exposed anywhere in this workflow - those are still only ever read at Cloud
      # Functions runtime via Firebase Secret Manager, never at install/build time here.
      - name: Build
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build
