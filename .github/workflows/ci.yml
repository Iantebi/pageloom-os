name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      # No secrets are required here: this installs dependencies and runs static
      # checks, unit tests, and a production build. Cloud Functions secrets are
      # only read at runtime via Firebase Secret Manager (see functions/src/config.ts),
      # never at install/build time, so none are configured or exposed to this workflow.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # backup-functions/ is a standalone package (own lockfile, not an npm workspace): it is the
      # only code `firebase deploy --only functions` ships to production.
      - name: Backup functions (install, typecheck, test, build, prod audit)
        run: |
          npm ci --prefix backup-functions
          npm --prefix backup-functions run typecheck
          npm --prefix backup-functions test
          npm --prefix backup-functions run build
          npm audit --prefix backup-functions --omit=dev --audit-level=high

      # discovery-storage-gateway/ is a separate standalone package and functions codebase
      # ("discovery-gateway"): private file storage for the Base44 Client Discovery app. Not deployed
      # by CI (deploys are manual and individually approved, see CLAUDE.md).
      - name: Discovery storage gateway (install, typecheck, test, build, prod audit)
        run: |
          npm ci --prefix discovery-storage-gateway
          npm --prefix discovery-storage-gateway run typecheck
          npm --prefix discovery-storage-gateway test
          npm --prefix discovery-storage-gateway run build
          npm audit --prefix discovery-storage-gateway --omit=dev --audit-level=moderate

      # Behavioral rules tests run the REAL firestore.rules/storage.rules files through the
      # actual Firestore/Storage emulator rules engine (see functions/src/*.behavioral.test.ts),
      # unlike the string-match rules tests above. They need a JVM (for the Firestore emulator)
      # and the emulators themselves, so they're kept out of the regular `npm test` step and run
      # here instead, against demo (non-billable, no-auth-required) Firebase projects only.
      - name: Set up Java (for Firestore emulator)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Behavioral Firestore/Storage rules tests (real emulator)
        # `emulators:exec` starts the emulators, waits for them to be healthy, runs the given
        # command, and always tears the emulators down afterwards - it fails (non-zero exit)
        # if the emulators never become healthy, so this step fails closed rather than silently
        # skipping the suite. No production credentials are used or required: this only ever
        # talks to demo-* project IDs on the local emulator, never real Firestore/Storage.
        run: npx firebase emulators:exec --project demo-pageloom-rules-fs --only firestore,storage "npm run test:behavioral --workspace=@pageloom/functions"
        timeout-minutes: 10

      # The two deployed backup functions, end to end on the Firestore emulator (demo-* project, no
      # credentials, every Google API call mocked and fail-closed): the real scheduled handlers write
      # their run records through the real Admin SDK, then a seeded dataset is exported and imported
      # into a fresh emulator and verified field-by-field (ids, types, timestamps, nested data,
      # references, subcollections). Catches Admin SDK / firebase-functions upgrade regressions that
      # mocked unit tests cannot.
      - name: Backup functions on the Firestore emulator (handlers + export/import round-trip)
        run: |
          npx firebase emulators:exec --project demo-pageloom-backup --only firestore "npm --prefix backup-functions run test:emulator"
          npx firebase emulators:exec --project demo-pageloom-backup --only firestore --export-on-exit="$RUNNER_TEMP/backup-roundtrip" "node backup-functions/test-emulator/restore-roundtrip.mjs seed"
          npx firebase emulators:exec --project demo-pageloom-backup --only firestore --import="$RUNNER_TEMP/backup-roundtrip" "node backup-functions/test-emulator/restore-roundtrip.mjs verify"
        timeout-minutes: 10

      # The OS end-to-end customer-lifecycle job (Functions emulator + the retired api) was removed on
      # 2026-11-21: PageLoom OS was retired and functions/ no longer defines any Cloud Function.
      # The rules behavioral suite above and backup-functions' own tests cover what is deployed.

      # Runs even when the known-failing behavioral step above fails, so a build regression is
      # never masked by (or blamed on) the documented emulator limitation.
      #
      # These 6 values are Firebase's public web client config (apiKey/authDomain/projectId/
      # storageBucket/messagingSenderId/appId) - not secrets. Per Firebase's own security model
      # they're meant to ship inside the built client bundle and are visible to anyone who opens
      # devtools on the deployed site; access control is enforced entirely by Firestore/Storage
      # Security Rules, never by hiding this config. That's why they're read from GitHub Actions
      # *variables* (`vars.*`, unmasked, listed under Settings > Actions > Variables) rather than
      # *secrets* (`secrets.*`) - using a secret here would be the wrong primitive and would
      # falsely suggest these need the same handling as an actual credential. No private/server
      # secret (API keys for Stripe/OpenAI/Google GenAI, service account credentials, etc.) is
      # used or exposed anywhere in this workflow - those are still only ever read at Cloud
      # Functions runtime via Firebase Secret Manager, never at install/build time here.
      - name: Build
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build
