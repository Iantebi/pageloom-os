name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # No secrets are required here: this installs dependencies and runs static
      # checks, unit tests, and a production build. Cloud Functions secrets are
      # only read at runtime via Firebase Secret Manager (see functions/src/config.ts),
      # never at install/build time, so none are configured or exposed to this workflow.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Behavioral rules tests run the REAL firestore.rules/storage.rules files through the
      # actual Firestore/Storage emulator rules engine (see functions/src/*.behavioral.test.ts),
      # unlike the string-match rules tests above. They need a JVM (for the Firestore emulator)
      # and the emulators themselves, so they're kept out of the regular `npm test` step and run
      # here instead, against demo (non-billable, no-auth-required) Firebase projects only.
      - name: Set up Java (for Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Behavioral Firestore/Storage rules tests (real emulator)
        # `emulators:exec` starts the emulators, waits for them to be healthy, runs the given
        # command, and always tears the emulators down afterwards - it fails (non-zero exit)
        # if the emulators never become healthy, so this step fails closed rather than silently
        # skipping the suite. No production credentials are used or required: this only ever
        # talks to demo-* project IDs on the local emulator, never real Firestore/Storage.
        run: npx firebase emulators:exec --project demo-pageloom-rules-fs --only firestore,storage "npm run test:behavioral --workspace=@pageloom/functions"
        timeout-minutes: 10

      - name: Build
        run: npm run build
